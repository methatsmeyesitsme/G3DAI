<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G3DAI</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<style>
:root{--bg:#07101d;--p:#0d1726;--p2:#111e30;--line:#203049;--t:#edf4ff;--m:#91a3ba;--a:#6f8cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif;height:100vh;overflow:hidden}button,input,textarea,select{font:inherit;color:inherit}button{border:0;cursor:pointer}.app{display:grid;grid-template-columns:235px 1fr 380px;height:100vh}.side,.model{background:var(--p);display:flex;flex-direction:column;border-right:1px solid var(--line)}.model{border-left:1px solid var(--line);border-right:0}.brand{padding:20px;font-size:21px;font-weight:800}.version{margin-top:4px;color:#63758e;font-size:10px;font-weight:500;letter-spacing:.6px}.brand span{color:var(--a)}.nav,.history{padding:0 12px}.nav button,.chat{display:block;width:100%;padding:10px 12px;text-align:left;background:transparent;color:var(--m);border-radius:9px;margin:2px 0}.nav button:hover,.chat:hover,.chat.active{background:#17263b;color:#fff}.label{padding:18px 12px 6px;color:#63758e;text-transform:uppercase;font-size:10px;letter-spacing:1px}.history{overflow:auto}.main{min-width:0;display:flex;flex-direction:column}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.status{color:var(--m);font-size:12px}.messages{flex:1;overflow:auto;padding:28px max(22px,calc((100% - 850px)/2));display:flex;flex-direction:column;gap:16px}.msg{max-width:850px;white-space:pre-wrap;line-height:1.55}.user{align-self:flex-end;background:#16243a;border:1px solid #223653;border-radius:16px 16px 4px 16px;padding:12px 15px;max-width:720px}.assistant{padding:6px 2px}.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--m);padding:30px}.composer{padding:14px max(22px,calc((100% - 850px)/2));border-top:1px solid var(--line)}.compose{background:var(--p2);border:1px solid var(--line);border-radius:15px;padding:10px}.compose textarea{width:100%;background:transparent;border:0;outline:0;resize:none;min-height:48px}.tools{display:flex;justify-content:space-between;align-items:center;margin-top:7px}.pill,.icon{background:#17263b;border:1px solid #263a57;border-radius:9px;padding:8px 10px}.primary{background:var(--a);color:#06101d;font-weight:700}.icon{width:36px}.preview{height:300px;background:#07101a;border-bottom:1px solid var(--line)}.preview canvas{display:block;width:100%;height:100%}.modelhead{padding:16px;border-bottom:1px solid var(--line)}.modeltitle{font-weight:700}.modelbody{overflow:auto}.card{margin:12px;padding:12px;background:var(--p2);border:1px solid var(--line);border-radius:12px}.row{display:flex;justify-content:space-between;padding:7px 0;color:var(--m)}.row b{color:var(--t);font-weight:500}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{padding:9px;border-radius:8px;background:#17263b}.actions .primary{background:var(--a)}.versions button{display:block;width:100%;text-align:left;background:transparent;padding:8px;border-radius:7px;color:var(--m)}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{width:min(620px,100%);background:var(--p);border:1px solid var(--line);border-radius:15px;padding:18px}.field{margin:12px 0}.field label{display:block;color:var(--m);font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;background:var(--p2);border:1px solid var(--line);padding:10px;border-radius:8px}.notice{padding:12px;border-radius:10px;background:#182238;color:#aebddd;line-height:1.45}.connect{display:flex;align-items:center;justify-content:space-between;gap:12px}.dot{width:9px;height:9px;border-radius:50%;background:#6d7c91;display:inline-block;margin-right:7px}.connectbtn{background:var(--a);color:#06101d;font-weight:700;padding:9px 13px;border-radius:8px}.subtle{font-size:11px;color:#71849d;margin-top:7px}@media(max-width:1050px){.app{grid-template-columns:210px 1fr}.model{display:none}}@media(max-width:650px){.app{grid-template-columns:1fr}.side{display:none}.messages,.composer{padding-left:14px;padding-right:14px}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand">G3D<span>AI</span><div class="version">v1.0.8</div></div><div class="nav"><button id="new">＋ New Chat</button><button id="search">⌕ Search</button><button id="projects">▦ Projects</button><button id="settings">⚙ Settings</button></div><div class="label">Chats</div><div class="history" id="history"></div></aside>
<main class="main"><header class="top"><span id="title">New Chat</span><span class="status" id="status">Grok: connector not installed</span></header><section class="messages" id="messages"></section><footer class="composer"><div class="compose"><textarea id="prompt" placeholder="Describe the 3D model you want..."></textarea><div class="tools"><div><button class="pill" id="attach">＋ Files</button><button class="pill" id="pasteGrok">＋ Add Grok Reply</button><input id="files" type="file" multiple hidden accept=".stl,.obj,.step,.stp,.3mf,.pdf,.txt,.png,.jpg,.jpeg,.webp"><span class="status" id="fileNames"></span></div><div><button class="icon" id="stop" disabled>■</button><button class="icon primary" id="send">↑</button></div></div></div></footer></main>
<aside class="model"><div class="modelhead"><div class="modeltitle" id="modelTitle">No model yet</div><div class="status" id="modelMeta">Real 3D preview</div></div><div class="preview" id="preview"></div><div class="modelbody" id="modelBody"></div></aside></div>
<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{STLExporter}from'three/addons/exporters/STLExporter.js';
const $=x=>document.getElementById(x),KEY='g3dai.state.v3';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{chats:[],active:null,settings:{printer:'Bambu Lab P2S',nozzle:'0.4',material:'PLA'},grok:{connected:true}},scene,camera,renderer,controls,mesh,job=null;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const uid=()=>crypto.randomUUID();function chat(){if(!S.active){let c={id:uid(),title:'New Chat',messages:[],models:[],updated:Date.now()};S.chats.unshift(c);S.active=c.id;save()}return S.chats.find(x=>x.id===S.active)}
function add(role,text){let c=chat();c.messages.push({role,text,at:Date.now()});c.updated=Date.now();if(role==='user'&&c.title==='New Chat')c.title=text.slice(0,40);save();render()}
function render(){let c=chat();$('title').textContent=c.title;let m=$('messages');m.innerHTML=c.messages.length?'':'<div class="empty"><div><h2>Design something real.</h2><p>Describe a printable object, its dimensions, material, or a reference.</p></div></div>';c.messages.forEach(x=>{let d=document.createElement('div');d.className='msg '+x.role;d.textContent=x.text;m.appendChild(d)});let h=$('history');h.innerHTML='';S.chats.sort((a,b)=>b.updated-a.updated).forEach(x=>{let b=document.createElement('button');b.className='chat '+(x.id===S.active?'active':'');b.textContent=x.title;b.onclick=()=>{S.active=x.id;save();render();showLast()};h.appendChild(b)});$('status').textContent='Grok: '+(S.grok.connected?'connected':'not connected');showLast()}
function phoneStand(){let g=new THREE.Group(),base=new THREE.Mesh(new THREE.BoxGeometry(90,75,8)),back=new THREE.Mesh(new THREE.BoxGeometry(90,8,65)),lip=new THREE.Mesh(new THREE.BoxGeometry(80,4,7));base.position.z=4;back.rotation.x=THREE.MathUtils.degToRad(25);back.position.set(0,10,36);lip.position.set(0,-25,12);g.add(base,back,lip);return g}
function squish(){let g=new THREE.Group(),a=new THREE.BoxGeometry(45,45,45),e=new THREE.EdgesGeometry(a),o=new THREE.LineSegments(e,new THREE.LineBasicMaterial()),i=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(39,39,39)),new THREE.LineBasicMaterial());g.add(o,i);return g}
function make(p){let q=p.toLowerCase(),type=q.includes('phone')&&q.includes('stand')?'phone-stand':(q.includes('squish')||q.includes('gyroid')?'squish-cube':'box'),g=type==='phone-stand'?phoneStand():type==='squish-cube'?squish():new THREE.Mesh(new THREE.BoxGeometry(40,40,40));g.traverse(o=>{if(o.isMesh)o.material=new THREE.MeshStandardMaterial({roughness:.7,metalness:.05})});return{name:type==='phone-stand'?'Adjustable Phone Stand':type==='squish-cube'?'GH3D Squish Cube':'Parametric Printable Part',type,g}}
function init(){let e=$('preview');scene=new THREE.Scene();scene.background=new THREE.Color(0x07101a);camera=new THREE.PerspectiveCamera(45,e.clientWidth/e.clientHeight,.1,2000);camera.position.set(120,100,150);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(e.clientWidth,e.clientHeight);e.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x304060,2));let l=new THREE.DirectionalLight(0xffffff,2);l.position.set(100,150,100);scene.add(l);addEventListener('resize',()=>{camera.aspect=e.clientWidth/e.clientHeight;camera.updateProjectionMatrix();renderer.setSize(e.clientWidth,e.clientHeight)});(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})()}
function show(g){if(!renderer)init();if(mesh)scene.remove(mesh);mesh=g;scene.add(g);let b=new THREE.Box3().setFromObject(g),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),mx=Math.max(s.x,s.y,s.z);g.position.sub(c);camera.position.set(mx*1.8,mx*1.5,mx*1.8);controls.target.set(0,0,0);controls.update()}
function stl(g){return new STLExporter().parse(g,{binary:true})}function dl(data,name){let u=URL.createObjectURL(new Blob([data],{type:'model/stl'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function showModel(v){$('modelTitle').textContent=v.name+' · v'+v.version;$('modelMeta').textContent=v.type+' · '+S.settings.material;let b=$('modelBody');b.innerHTML='<div class="card"><div class="row"><span>Version</span><b>v'+v.version+'</b></div><div class="row"><span>Printer</span><b>'+S.settings.printer+'</b></div><div class="row"><span>Nozzle</span><b>'+S.settings.nozzle+' mm</b></div><div class="row"><span>Material</span><b>'+S.settings.material+'</b></div><div class="actions"><button id="dl">Download STL</button><button id="var" class="primary">Create variation</button></div><div class="label" style="padding-left:0">Versions</div><div id="vers" class="versions"></div></div>';show(make(v.prompt).g);$('dl').onclick=()=>{let x=make(v.prompt);show(x.g);dl(stl(x.g),v.name.replace(/\s+/g,'-').toLowerCase()+'-v'+v.version+'.stl')};$('var').onclick=()=>{$('prompt').value='Modify '+v.name+': ';$('prompt').focus()};chat().models.forEach(x=>{let z=document.createElement('button');z.textContent='v'+x.version+' · '+x.name;z.onclick=()=>showModel(x);$('vers').appendChild(z)})}
function showLast(){let c=chat();if(c.models.length)showModel(c.models[c.models.length-1])}
const GROK_WEB='https://grok.com/';
let grokExtensionReady=false;
let grokWaiting=false;

function buildGrokPrompt(p){
  let files=[...$('files').files].map(x=>x.name);
  return 'You are the AI design partner inside G3DAI, a professional 3D-modeling and 3D-printing workflow. Help design a real printable model.\n\nUser request:\n'+p+'\n\nPrinter: '+S.settings.printer+'\nNozzle: '+S.settings.nozzle+' mm\nMaterial: '+S.settings.material+(files.length?'\nAttached file names: '+files.join(', '):'')+'\n\nGive precise dimensions, constraints, modeling approach, and practical 3D-printing guidance. When useful, provide complete OpenSCAD, Blender Python, or other directly usable model-generation code. Do not claim an STL was created unless you actually provide a file or complete reproducible model data.';
}

function openGrok(p){
  const q=buildGrokPrompt(p);
  try{navigator.clipboard.writeText(q)}catch{}
  const u=GROK_WEB+'?q='+encodeURIComponent(q);
  const w=window.open(u,'_blank');
  if(!w)window.location.href=u;
}

function sendToGrokExtension(p){
  grokWaiting=true;
  window.postMessage({type:'g3dai-send-to-grok',prompt:buildGrokPrompt(p)},'*');
}

window.addEventListener('message',e=>{
  if(e.source!==window||!e.data)return;
  if(e.data.type==='g3dai-extension-ready'){
    grokExtensionReady=true;
    $('status').textContent='Grok: connected';
  }
  if(e.data.type==='g3dai-grok-working'){
    $('status').textContent='Grok: working…';
  }
  if(e.data.type==='g3dai-grok-reply'&&grokWaiting){
    grokWaiting=false;
    add('assistant',String(e.data.text||'Grok returned an empty response.'));
    $('status').textContent='Grok: connected';
  }
});

function refreshGrok(){
  window.postMessage({type:'g3dai-extension-ping'},'*');
  if(!grokExtensionReady)$('status').textContent='Grok: connector not installed';
}
async function send(){
  let p=$('prompt').value.trim();
  if(!p||job)return;
  add('user',p);
  $('prompt').value='';
  job={cancel:false};

  if(grokExtensionReady){
    sendToGrokExtension(p);
    add('assistant','Sending to your signed-in Grok browser session…');
  }else{
    add('assistant','The G3DAI Grok Connector is not installed. Opening Grok with your prompt copied so you can use it manually.');
    openGrok(p);
  }

  $('stop').disabled=false;
}
$('send').onclick=send;$('stop').onclick=()=>{if(job){job.cancel=true;job=null;$('stop').disabled=true;add('assistant','Generation stopped.')}};$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('new').onclick=()=>{S.active=null;chat();save();render()};$('attach').onclick=()=>$('files').click();$('pasteGrok').onclick=()=>{let r=window.prompt("Paste Grok's response here");if(r&&r.trim())add('assistant',r.trim())};$('files').onchange=()=>{$('fileNames').textContent=[...$('files').files].map(x=>x.name).join(', ')};$('search').onclick=()=>{let q=prompt('Search chats');if(q)alert(S.chats.filter(x=>x.title.toLowerCase().includes(q.toLowerCase())).map(x=>x.title).join('\n')||'No matches')};
function modal(s){$('modalbox').innerHTML=s;$('modal').classList.add('show')};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
function connectGrok(){
  if(grokExtensionReady){
    $('status').textContent='Grok: connected';
    return;
  }
  modal('<h2>Connect Grok</h2><div class="notice"><b>One-time browser connector</b><br><br>Install the G3DAI Grok Connector from the extension folder in this GitHub repo. Then sign in normally at grok.com. G3DAI never receives your Grok password and no xAI API key is used.</div><div class="field"><label>After installing</label><div class="notice">1. Sign in at grok.com.<br>2. Keep the connector enabled.<br>3. Return here and press Check connection.</div></div><div class="actions"><button id="check" class="primary">Check connection</button><button id="open" >Open Grok</button></div>');
  $('check').onclick=()=>{window.postMessage({type:'g3dai-extension-ping'},'*');setTimeout(()=>{if(grokExtensionReady){$('status').textContent='Grok: connected';$('modal').classList.remove('show')}else{$('status').textContent='Grok: connector not installed';}},500)};
  $('open').onclick=()=>window.open(GROK_WEB,'_blank');
}
$('settings').onclick=()=>{
  modal('<h2>Settings</h2><div class="field"><label>Grok connection</label><div class="card" style="margin:0"><div class="connect"><span><span class="dot" style="background:'+(grokExtensionReady?'#62d18a':'#6d7c91')+'"></span><b>'+(grokExtensionReady?'Connected':'Connector not installed')+'</b></span><button class="connectbtn" id="connect">Connect</button></div><div class="subtle">No xAI API key is used or stored by G3DAI. The connector uses the Grok website session already signed into your browser.</div></div></div><div class="field"><label>Printer</label><input id="pr" value="'+S.settings.printer+'"></div><div class="field"><label>Nozzle</label><input id="no" value="'+S.settings.nozzle+'"></div><div class="field"><label>Material</label><select id="ma"><option>PLA</option><option>TPU</option><option>PETG</option><option>ABS</option></select></div><button class="pill primary" id="saveSet">Save</button>');
  $('ma').value=S.settings.material;
  $('connect').onclick=connectGrok;
  $('saveSet').onclick=()=>{
    S.settings.printer=$('pr').value;
    S.settings.nozzle=$('no').value;
    S.settings.material=$('ma').value;
    save();
    $('modal').classList.remove('show');
    render();
  };
};
$('projects').onclick=()=>modal('<h2>Projects</h2><div class="notice">Chats and model history are saved in this browser. Grok handles your account login on grok.com.</div>');
render();refreshGrok();
</script></body></html>
