<script>
(function(){
  var KEY='g3dai.state.v3',CHAT_KEY='g3dai.chats.v1';
  function readState(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object'){if(!Array.isArray(s.chats)){var legacy=JSON.parse(localStorage.getItem(CHAT_KEY)||'null');if(Array.isArray(legacy))s.chats=legacy}return s}var legacy=JSON.parse(localStorage.getItem(CHAT_KEY)||'null');return Array.isArray(legacy)?{chats:legacy,active:null}:{} }catch(e){return {}}}
  function persistState(s){try{localStorage.setItem(KEY,JSON.stringify(s));localStorage.setItem(CHAT_KEY,JSON.stringify(Array.isArray(s.chats)?s.chats:[]))}catch(e){}}
  function renderStandaloneChatMessages(chat){var box=document.getElementById('messages');if(!box)return;var list=chat&&Array.isArray(chat.messages)?chat.messages:[];box.innerHTML=list.length?'':'<div class="empty"><div><h2>Design something real.</h2><p>Describe a printable object, its dimensions, material, or a reference.</p></div></div>';list.forEach(function(msg){var d=document.createElement('div');d.className='msg '+(msg.role||'assistant');d.textContent=String(msg.text||'');box.appendChild(d)});box.scrollTo({top:box.scrollHeight,behavior:'smooth'})}
  window.__g3daiOpenSavedChat=function(id){try{var state=readState(),chats=Array.isArray(state.chats)?state.chats:[],target=chats.find(function(x){return String(x.id)===String(id)});if(!target)return;state.active=target.id;persistState(state);if(typeof window.__g3daiSelectChat==='function'){window.__g3daiSelectChat(target.id);return}renderStandaloneChatMessages(target);renderSavedChats()}catch(e){}};
  window.__g3daiNewChatStandalone=function(e){if(e){e.preventDefault();e.stopPropagation()}try{if(typeof window.__g3daiCreateNewChat==='function')return window.__g3daiCreateNewChat();var state=readState();state.chats=Array.isArray(state.chats)?state.chats:[];var id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2));var fresh={id:id,title:'New Chat',messages:[],models:[],updated:Date.now()};state.chats.unshift(fresh);state.active=id;persistState(state);renderStandaloneChatMessages(fresh);renderSavedChats()}catch(e){}};
  function renderSavedChats(){var history=document.getElementById('history');if(!history)return;var s=readState(),chats=Array.isArray(s.chats)?s.chats:[];chats.sort(function(a,b){return (b.updated||0)-(a.updated||0)});history.innerHTML='';chats.forEach(function(chat){var row=document.createElement('div');row.className='chatrow';var b=document.createElement('button');b.className='chat '+(chat.id===s.active?'active':'');b.type='button';b.textContent=chat.title||'New Chat';b.onclick=function(e){if(e){e.preventDefault();e.stopPropagation()}window.__g3daiOpenSavedChat(chat.id)};var del=document.createElement('button');del.className='deletechat';del.type='button';del.title='Delete chat';del.setAttribute('aria-label','Delete '+(chat.title||'New Chat'));del.textContent='×';del.onclick=function(e){e.preventDefault();e.stopPropagation();window.__g3daiConfirmDeleteChat(chat.id,chat.title||'New Chat')};row.appendChild(b);row.appendChild(del);history.appendChild(row)})}
  function writeMenuState(closed){var s=readState();s.ui=s.ui||{};s.ui.leftClosed=!!closed;persistState(s)}
  function applyMenu(closed){var app=document.querySelector('.app'),btn=document.getElementById('menuToggle');if(!app||!btn)return;app.classList.toggle('left-closed',!!closed);app.classList.toggle('left-open',!closed);btn.setAttribute('aria-expanded',closed?'false':'true');btn.title=closed?'Open left menu':'Close left menu'}
  window.__g3daiToggleMenu=function(e){if(e){e.preventDefault();e.stopPropagation()}var s=readState();var closed=!(s.ui&&s.ui.leftClosed);writeMenuState(closed);applyMenu(closed)};
  window.__g3daiApplyMenu=function(){var s=readState();applyMenu(!!(s.ui&&s.ui.leftClosed))};
  function applyRightMenu(closed){var app=document.querySelector('.app'),btn=document.getElementById('rightMenuToggle');if(!app||!btn)return;app.classList.toggle('right-closed',!!closed);btn.setAttribute('aria-expanded',closed?'false':'true');btn.title=closed?'Open right menu':'Close right menu';window.__g3daiRightClosed=!!closed}
  window.__g3daiToggleRightMenu=function(e){if(e){e.preventDefault();e.stopPropagation()}var s=readState();s.ui=s.ui||{};s.ui.rightClosed=!(s.ui.rightClosed);persistState(s);applyRightMenu(s.ui.rightClosed)};
  window.__g3daiApplyRightMenu=function(){var s=readState();applyRightMenu(!!(s.ui&&s.ui.rightClosed))};
  window.__g3daiNewChat=function(e){window.__g3daiNewChatStandalone(e)};
  window.__g3daiCloseModal=function(e){if(e){e.preventDefault();e.stopPropagation()}var modal=document.getElementById('modal');if(modal)modal.classList.remove('show')};
  function g3daiOpenModal(html){var modal=document.getElementById('modal'),box=document.getElementById('modalbox');if(!modal||!box)return;box.innerHTML='<button class="modal-close" type="button" aria-label="Close" onclick="window.__g3daiCloseModal(event)">×</button>'+html;modal.classList.add('show')}
  window.__g3daiConfirmDeleteChat=function(id,title){
    var modal=document.getElementById('modal'),box=document.getElementById('modalbox');if(!modal||!box)return;
    var safeTitle=String(title||'New Chat').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    g3daiOpenModal('<h2>Delete chat?</h2><div class="notice">Delete <b>'+safeTitle+'</b>? This cannot be undone.</div><div class="actions"><button id="cancelDelete">Cancel</button><button id="confirmDelete" class="primary">Delete</button></div>');
    var cancel=document.getElementById('cancelDelete'),confirmBtn=document.getElementById('confirmDelete');
    if(cancel)cancel.onclick=window.__g3daiCloseModal;
    if(confirmBtn)confirmBtn.onclick=function(e){if(e){e.preventDefault();e.stopPropagation()}modal.classList.remove('show');if(typeof window.__g3daiDeleteChatNow==='function')window.__g3daiDeleteChatNow(id);else{try{var state=readState(),list=Array.isArray(state.chats)?state.chats:[],index=list.findIndex(function(x){return String(x.id)===String(id)});if(index>=0){list.splice(index,1);state.chats=list;if(String(state.active)===String(id))state.active=null;persistState(state);renderSavedChats();renderStandaloneChatMessages({messages:[]})}}catch(_){}}};
  }
  window.__g3daiFallbackSearch=function(){var s=readState(),q=window.prompt('Search chats');if(!q)return;var matches=(s.chats||[]).filter(function(x){return String(x.title||'').toLowerCase().includes(q.toLowerCase())});window.alert(matches.length?matches.map(function(x){return x.title||'New Chat'}).join('\n'):'No matches')};
  window.__g3daiFallbackProjects=function(){g3daiOpenModal('<h2>Projects</h2><div class="notice">Your chats and Grok-generated model history are saved in this browser.</div><div class="actions"><button id="fallbackProjectsClose" class="primary" type="button">Close</button></div>');var b=document.getElementById('fallbackProjectsClose');if(b)b.onclick=window.__g3daiCloseModal};
  window.__g3daiHandleSend=async function(e){
    if(e){e.preventDefault();e.stopPropagation()}
    if(typeof window.__g3daiSend==='function')return window.__g3daiSend();
    var prompt=document.getElementById('prompt'),status=document.getElementById('status');if(!prompt)return;var text=prompt.value.trim();if(!text)return;prompt.value='';
    var state=readState();state.chats=Array.isArray(state.chats)?state.chats:[];var chat=state.chats.find(function(x){return String(x.id)===String(state.active)});
    if(!chat){chat={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),title:'New Chat',messages:[],models:[],updated:Date.now()};state.chats.unshift(chat);state.active=chat.id}
    chat.messages=Array.isArray(chat.messages)?chat.messages:[];chat.models=Array.isArray(chat.models)?chat.models:[];chat.messages.push({role:'user',text:text,at:Date.now()});persistState(state);if(status)status.textContent='Grok: Thinking…';
    try{
      var resp=await fetch('http://127.0.0.1:8787/api/grok/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chatId:chat.id,prompt:text,history:chat.messages.map(function(x){return {role:x.role,text:x.text}}),printer:(state.settings&&state.settings.printer)||'Bambu Lab P2S',nozzle:(state.settings&&state.settings.nozzle)||'0.4',material:(state.settings&&state.settings.material)||'PLA'})});
      var data={};try{data=await resp.json()}catch(_){}if(!resp.ok)throw new Error(data.error||'Grok request failed');
      if(data.stlGenerated&&data.url)chat.models.push({version:String(chat.models.length+1).padStart(2,'0'),prompt:text,name:data.name||'Grok Model',type:'stl',fileName:data.fileName,fileUrl:'http://127.0.0.1:8787'+data.url,grokGenerated:true});
      chat.messages.push({role:'assistant',text:String(data.output||'Grok returned an empty response.'),at:Date.now()});chat.updated=Date.now();persistState(state);if(status)status.textContent='Grok: connected';renderSavedChats();window.location.reload();
    }catch(err){chat.messages.push({role:'assistant',text:'Grok error: '+err.message,at:Date.now()});persistState(state);if(status)status.textContent='Grok: error';renderStandaloneChatMessages(chat)}
  };
  (function installFallbackLeftActions(){var search=document.getElementById('search'),projects=document.getElementById('projects');if(search)search.addEventListener('click',function(){if(window.__g3daiModuleReady)return;window.__g3daiFallbackSearch()});if(projects)projects.addEventListener('click',function(){if(window.__g3daiModuleReady)return;window.__g3daiFallbackProjects()})})();
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',function(){window.__g3daiApplyMenu();window.__g3daiApplyRightMenu();renderSavedChats()},{once:true})}else{window.__g3daiApplyMenu();window.__g3daiApplyRightMenu();renderSavedChats()}
})();
</script>
<script type="module">

const $=x=>document.getElementById(x),KEY='g3dai.state.v3',CHAT_KEY='g3dai.chats.v1';let S=(function(){try{return JSON.parse(localStorage.getItem(KEY)||'null')||null}catch(e){return null}})();
if(!S){try{let legacy=JSON.parse(localStorage.getItem(CHAT_KEY)||'null');S={chats:Array.isArray(legacy)?legacy:[],active:null,settings:{printer:'Bambu Lab P2S',nozzle:'0.4',material:'PLA',theme:'dark'},grok:{connected:false,backendUrl:''},ui:{leftClosed:false,rightClosed:false}}}catch(e){S={chats:[],active:null,settings:{printer:'Bambu Lab P2S',nozzle:'0.4',material:'PLA',theme:'dark'},grok:{connected:false,backendUrl:''},ui:{leftClosed:false,rightClosed:false}}}};
let scene,camera,renderer,controls,mesh,job=null,thinking=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(CHAT_KEY,JSON.stringify(S.chats||[]))}catch(e){}};
const uid=()=>crypto.randomUUID();

      chatId:c.id,
      prompt:'Create a short name for this chat. Return ONLY the chat name. Use 1 to 4 words maximum. No quotes. No punctuation. Do not explain anything.',
      history:c.messages.map(x=>({role:x.role,text:x.text})),
      printer:S.settings.printer,
      nozzle:S.settings.nozzle,
      material:S.settings.material

      c.updated=Date.now();
      save();

}
function add(role,text){

  c.updated=Date.now();

function deleteChatNow(id){
  let index=S.chats.findIndex(x=>String(x.id)===String(id));if(index<0)return;
  let wasActive=String(S.active)===String(id);
  S.chats.splice(index,1);

  thinking=false;
  if($('prompt'))$('prompt').value='';
  save();
  render();
}

function render(){

  let c=Array.isArray(S.chats)&&S.active!=null?S.chats.find(x=>String(x.id)===String(S.active)):null;

async function send(){
  let p=$('prompt').value.trim();if(!p||job)return;
  let c=chat();if(!c)return;
  c.messages=Array.isArray(c.messages)?c.messages:[];
  c.messages.push({role:'user',text:p,at:Date.now()});
  c.updated=Date.now();
  S.active=c.id;
  save();
  $('prompt').value='';
  job={cancel:false};let jobRef=job,startedAt=Date.now();
  updateSendButton();
  thinking=true;
  renderActiveChatMessages(c);
  renderSavedChats();
  render();
  let thinkingTimer=setInterval(()=>{
    if(!thinking)return;
    let seconds=Math.floor((Date.now()-startedAt)/1000);
    $('status').textContent='Grok: Thinking… '+Math.floor(seconds/60)+'m '+String(seconds%60).padStart(2,'0')+'s';
  },1000);
  try{
    let history=c.messages.map(x=>({role:x.role,text:x.text}));
    let d=await api('/api/grok/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chatId:c.id,prompt:p,history,printer:S.settings.printer,nozzle:S.settings.nozzle,material:S.settings.material})});
    if(jobRef.cancel)return;thinking=false;
    if(d.stlGenerated&&d.url){addGrokStlModel(c,p,d);await typeAssistant(d.output||('Grok created the real STL file: '+d.fileName),jobRef);if(c.title==='New Chat'){c.title=(d.name||'Grok Model')+' STL';c.updated=Date.now();save()}}
    else{await typeAssistant(d.output||'Grok returned an empty response.',jobRef);nameChatWithGrok(c)}
  }catch(e){thinking=false;if(!jobRef.cancel)add('assistant','Grok error: '+e.message)}
  finally{if(thinkingTimer)clearInterval(thinkingTimer);if(job===jobRef)job=null;updateSendButton();refreshGrok()}
}window.__g3daiSend=send;

const app=document.querySelector('.app');
const sideMenu=document.querySelector('.side');
const menuBackdrop=$('menuBackdrop');

function syncMenus(){
  S.ui=S.ui||{};
  const closed=!!S.ui.leftClosed;
  const rightClosed=typeof window.__g3daiRightClosed==='boolean'?window.__g3daiRightClosed:!!S.ui.rightClosed;
  S.ui.rightClosed=rightClosed;
  app.classList.toggle('left-closed',closed);
  app.classList.toggle('left-open',!closed);
  app.classList.toggle('right-closed',rightClosed);
  $('menuToggle').setAttribute('aria-expanded',closed?'false':'true');
  $('menuToggle').title=closed?'Open left menu':'Close left menu';
  const rb=$('rightMenuToggle');
  if(rb){
    rb.setAttribute('aria-expanded',rightClosed?'false':'true');
    rb.title=rightClosed?'Open right menu':'Close right menu';
  }
}

function closeLeftMenu(){
  S.ui=S.ui||{};
  S.ui.leftClosed=true;
  save();
  syncMenus();
}

function toggleLeftMenu(){
  S.ui=S.ui||{};
  S.ui.leftClosed=!S.ui.leftClosed;
  save();
  syncMenus();
}

menuBackdrop.addEventListener('pointerdown',e=>{
  e.preventDefault();
  closeLeftMenu();
});
menuBackdrop.addEventListener('click',closeLeftMenu);

document.addEventListener('pointerdown',e=>{
  if(S.ui?.leftClosed)return;
  if(sideMenu.contains(e.target)||$('menuToggle').contains(e.target))return;
  closeLeftMenu();
},true);
