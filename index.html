gin:12px 0}.field label{display:block;color:var(--m);font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;background:var(--p2);border:1px solid var(--line);padding:10px;border-radius:8px}.notice{padding:12px;border-radius:10px;background:#182238;color:#aebddd;line-height:1.45}.connect{display:flex;align-items:center;justify-content:space-between;gap:12px}.dot{width:9px;height:9px;border-radius:50%;background:#6d7c91;display:inline-block;margin-right:7px}.connectbtn{background:var(--a);color:#06101d;font-weight:700;padding:9px 13px;border-radius:8px}.subtle{font-size:11px;color:#71849d;margin-top:7px}.thinking{display:flex;align-items:center;gap:7px;color:var(--m);padding:6px 2px;font-size:13px}.thinking .dots{display:inline-flex;gap:3px}.thinking .dotx{width:5px;height:5px;border-radius:50%;background:currentColor;animation:thinkPulse 1.15s infinite ease-in-out}.thinking .dotx:nth-child(2){animation-delay:.15s}.thinking .dotx:nth-child(3){animation-delay:.3s}@keyframes thinkPulse{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}.typewriter-caret{display:inline-block;width:7px;height:1.05em;vertical-align:-2px;border-radius:2px;background:currentColor;animation:caretBlink .8s steps(1) infinite}@keyframes caretBlink{50%{opacity:0}}body.light{--bg:#f5f7fb;--p:#ffffff;--p2:#eef2f8;--line:#d6deea;--t:#152033;--m:#5f6e83;--a:#5f78e8}body.light .side,body.light .model{background:#fff}body.light .top{background:#fff}body.light .nav button:hover,body.light .chat:hover,body.light .chat.active{background:#e8edf7;color:#152033}body.light .user{background:#e9eef8;border-color:#d2dbea}body.light .compose,body.light .card,body.light .field input,body.light .field select{background:#f0f3f8;border-color:#d6deea}body.light .pill,body.light .icon,body.light .actions button{background:#e7ecf5;border-color:#d0d9e8}body.light .primary{color:#fff;background:#6079e8}body.light .modalbox{background:#fff}body.light .notice{background:#eef2f8;color:#5b6a80}body.light .preview{background:#eef2f7}@media(max-width:1050px){.side{width:210px}.model{display:none}}@media(max-width:650px){.side{width:min(280px,82vw);z-index:1000}.model{display:none}.messages,.composer{padding-left:14px;padding-right:14px}.top{padding-left:10px;padding-right:10px}.top-left{gap:8px}.title-stack{max-width:calc(100vw - 100px)}}</style></head><body>

<script>
(function(){
  var KEY='g3dai.state.v3';
  var CHAT_KEY='g3dai.chats.v1';
  function readState(){
    try{
      var s=JSON.parse(localStorage.getItem(KEY)||'null')||{};
      var chats=JSON.parse(localStorage.getItem(CHAT_KEY)||'null');
      if(Array.isArray(chats))s.chats=chats;
      return s;
    }catch(e){return {};}
  }
  function persistState(s){
    try{
      localStorage.setItem(KEY,JSON.stringify(s));
      localStorage.setItem(CHAT_KEY,JSON.stringify(Array.isArray(s.chats)?s.chats:[]));
    }catch(e){}
  }
  function renderSavedChats(){
    var history=document.getElementById('history');
    if(!history)return;
    var s=readState();
    var chats=Array.isArray(s.chats)?s.chats:[];
    chats.sort(function(a,b){return (b.updated||0)-(a.updated||0);});
    history.innerHTML='';
    chats.forEach(function(chat){
      var row=document.createElement('div');
      row.className='chatrow';
      var b=document.createElement('button');
      b.className='chat '+(chat.id===s.active?'active':'');
      b.type='button';
      b.textContent=chat.title||'New Chat';
      b.onclick=function(e){
        if(e){e.preventDefault();e.stopPropagation();}
        if(typeof window.__g3daiOpenChat==='function'){
          window.__g3daiOpenChat(chat.id);
          return;
        }
        var state=readState();
        state.active=chat.id;
        persistState(state);
        renderSavedChats();
        window.location.reload();
      };
      var del=document.createElement('button');
      del.className='deletechat';
      del.type='button';
      del.title='Delete chat';
      del.setAttribute('aria-label','Delete '+(chat.title||'New Chat'));
      del.textContent='×';
      del.onclick=function(e){
        e.preventDefault();
        e.stopPropagation();
        var state=readState();
        var list=Array.isArray(state.chats)?state.chats:[];
        var index=list.findIndex(function(x){return x.id===chat.id;});
        if(index<0)return;
        if(!window.confirm('Delete "'+(list[index].title||'New Chat')+'"?'))return;
        list.splice(index,1);
        state.chats=list;
        if(state.active===chat.id)state.active=list[0]?list[0].id:null;
        persistState(state);
        renderSavedChats();
        window.location.reload();
      };
      row.appendChild(b);
      row.appendChild(del);
      history.appendChild(row);
    });
  }
  function writeMenuState(closed){
    var s=readState();
    s.ui=s.ui||{};
    s.ui.leftClosed=!!closed;
    try{persistState(s);}catch(e){}
  }
  function applyMenu(closed){
    var app=document.querySelector('.app');
    var btn=document.getElementById('menuToggle');
    if(!app||!btn)return;
    app.classList.toggle('left-closed',!!closed);
    app.classList.toggle('left-open',!closed);
    btn.setAttribute('aria-expanded',closed?'false':'true');
    btn.title=closed?'Open left menu':'Close left menu';
  }
  window.__g3daiToggleMenu=function(e){
    if(e){
      e.preventDefault();
      e.stopPropagation();
    }
    var s=readState();
    var closed=!(s.ui&&s.ui.leftClosed);
    writeMenuState(closed);
    applyMenu(closed);
  };
  window.__g3daiApplyMenu=function(){
    var s=readState();
    applyMenu(!!(s.ui&&s.ui.leftClosed));
  };
  function applyRightMenu(closed){
    var app=document.querySelector('.app');
    var btn=document.getElementById('rightMenuToggle');
    if(!app||!btn)return;
    app.classList.toggle('right-closed',!!closed);
    btn.setAttribute('aria-expanded',closed?'false':'true');
    btn.title=closed?'Open right menu':'Close right menu';
    window.__g3daiRightClosed=!!closed;
  }
  window.__g3daiGenerateFileFallback=function(state,chat,prompt){
    var q=String(prompt||'').toLowerCase();
    if(!(/\\bstl\\b|\\.stl\\b/.test(q)&&/(make|create|generate|build|export|file|download)/.test(q)))return;
    if(!Array.isArray(chat.models))chat.models=[];
    if(chat.models.some(function(x){return x.prompt===prompt}))return;
    var name=q.includes('cone')?'Cone':'Printable Part';
    var version=String(chat.models.length+1).padStart(2,'0');
    var model={version:version,prompt:prompt,name:name,type:q.includes('cone')?'cone':'box'};
    chat.models.push(model);
    chat.updated=Date.now();
    persistState(state);
    var radius=20,height=50,segments=64;
    var dm=q.match(/(?:diameter|dia)\\s*(?:is|of|=)?\\s*(\\d+(?:\\.\\d+)?)\\s*mm/);
    var rm=q.match(/(?:radius)\\s*(?:is|of|=)?\\s*(\\d+(?:\\.\\d+)?)\\s*mm/);
    var hm=q.match(/(?:height|tall)\\s*(?:is|of|=)?\\s*(\\d+(?:\\.\\d+)?)\\s*mm/);
    if(dm)radius=Number(dm[1])/2;
    if(rm)radius=Number(rm[1]);
    if(hm)height=Number(hm[1]);
    if(q.includes('cone')){
      var tris=[];
      function addTri(a,b,d){
        var ux=b[0]-a[0],uy=b[1]-a[1],uz=b[2]-a[2],vx=d[0]-a[0],vy=d[1]-a[1],vz=d[2]-a[2];
        var nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx,ln=Math.hypot(nx,ny,nz)||1;
        tris.push([nx/ln,ny/ln,nz/ln,a,b,d]);
      }
      var apex=[0,0,height],center=[0,0,0];
      for(var i=0;i<segments;i++){
        var a1=2*Math.PI*i/segments,a2=2*Math.PI*(i+1)/segments;
        var p1=[radius*Math.cos(a1),radius*Math.sin(a1),0],p2=[radius*Math.cos(a2),radius*Math.sin(a2),0];
        addTri(p1,apex,p2);
        addTri(center,p2,p1);
      }
      var s='solid cone\\n';
      tris.forEach(function(t){
        s+=' facet normal '+t[0].map(function(x){return x.toFixed(7)}).join(' ')+'\\n outer loop\\n';
        [t[3],t[4],t[5]].forEach(function(v){s+='  vertex '+v.map(function(x){return Number(x).toFixed(4)}).join(' ')+'\\n';});
        s+=' endloop\\n endfacet\\n';
      });
      s+='endsolid cone';
      var blob=new Blob([s],{type:'model/stl'});
      var u=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=u;a.download='cone-v'+version+'.stl';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000);
    }
  };
  window.__g3daiHandleSend=async function(e){
    if(e){
      e.preventDefault();
      e.stopPropagation();
    }
    if(typeof window.__g3daiSend==='function'){
      return window.__g3daiSend();
    }
    var prompt=document.getElementById('prompt');
    var status=document.getElementById('status');
    if(!prompt)return;
    var text=prompt.value.trim();
    if(!text)return;
    prompt.value='';
    var key='g3dai.state.v3';
    var state=readState();
    state.chats=Array.isArray(state.chats)?state.chats:[];
    state.settings=state.settings||{printer:'Bambu Lab P2S',nozzle:'0.4',material:'PLA',theme:'dark'};
    var chat=state.chats.find(function(x){return x.id===state.active;});
    if(!chat){
      chat={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())),title:'New Chat',messages:[],models:[],updated:Date.now()};
      state.chats.unshift(chat);
      state.active=chat.id;
    }
    if(!Array.isArray(chat.messages))chat.messages=[];
    if(chat.title==='New Chat')chat.title=text.slice(0,40);
    chat.messages.push({role:'user',text:text,at:Date.now()});
    chat.updated=Date.now();
    try{persistState(state);}catch(err){}
    renderSavedChats();
    if(status)status.textContent='Grok: Thinking…';
    var box=document.getElementById('messages');
    if(box){
      var user=document.createElement('div');
      user.className='msg user';
      user.textContent=text;
      box.appendChild(user);
      var thinking=document.createElement('div');
      thinking.className='thinking';
      thinking.innerHTML='<span>Thinking</span><span class="dots"><span class="dotx"></span><span class="dotx"></span><span class="dotx"></span></span>';
      box.appendChild(thinking);
      box.scrollTo({top:box.scrollHeight,behavior:'smooth'});
    }
    try{
      var resp=await fetch('http://127.0.0.1:8787/api/grok/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          chatId:chat.id,
          prompt:text,
          history:chat.messages.map(function(x){return {role:x.role,text:x.text};}),
          printer:state.settings.printer,
          nozzle:state.settings.nozzle,
          material:state.settings.material
        })
      });
      var data={};
      try{data=await resp.json();}catch(err){}
      if(!resp.ok)throw new Error(data.error||'Grok bridge request failed');
      var output=data.output||'Grok returned an empty response.';
      chat.messages.push({role:'assistant',text:output,at:Date.now()});
      chat.updated=Date.now();
      try{persistState(state);}catch(err){}
      if(typeof window.__g3daiGenerateFileFallback==='function')window.__g3daiGenerateFileFallback(state,chat,text);
      renderSavedChats();
      generateChatTitleStandalone(state,chat);
      if(box){
        if(box.lastElementChild)box.lastElementChild.remove();
        var assistant=document.createElement('div');
        assistant.className='msg assistant';
        assistant.textContent=output;
        box.appendChild(assistant);
        box.scrollTo({top:box.scrollHeight,behavior:'smooth'});
      }
      if(status)status.textContent='Grok: connected';
    }catch(err){
      if(box&&box.lastElementChild&&box.lastElementChild.classList.contains('thinking'))box.lastElementChild.remove();
      var msg='Grok error: '+(err&&err.message?err.message:'Unable to reach G3DAI Grok bridge.');
      chat.messages.push({role:'assistant',text:msg,at:Date.now()});
      chat.updated=Date.now();
      try{persistState(state);}catch(e2){}
      if(box){
        var assistantErr=document.createElement('div');
        assistantErr.className='msg assistant';
        assistantErr.textContent=msg;
        box.appendChild(assistantErr);
        box.scrollTo({top:box.scrollHeight,behavior:'smooth'});
      }
      if(status)status.textContent='Grok: not connected';
    }
  };
  window.__g3daiNewChat=function(e){
    if(e){
      e.preventDefault();
      e.stopPropagation();
    }
    try{
      var s=readState();
      s.chats=Array.isArray(s.chats)?s.chats:[];
      s.active=null;
      persistState(s);
      renderSavedChats();
    }catch(err){}
    window.location.reload();
  };
  window.__g3daiToggleRightMenu=function(e){
    if(e){
      e.preventDefault();
      e.stopPropagation();
    }
    var s=readState();
    s.ui=s.ui||{};
    var closed=!(s.ui&&s.ui.rightClosed);
    s.ui.rightClosed=closed;
    try{persistState(s);}catch(e){}
    applyRightMenu(closed);
  };
  window.__g3daiApplyRightMenu=function(){
    var s=readState();
    applyRightMenu(!!(s.ui&&s.ui.rightClosed));
  };
  function g3daiOpenModal(html){
    var modal=document.getElementById('modal');
    var box=document.getElementById('modalbox');
    if(!modal||!box)return;
    box.innerHTML='<button class="modal-close" type="button" aria-label="Close" onclick="window.__g3daiCloseModal(event)">×</button>'+html;
    modal.classList.add('show');
  }
  function g3daiCloseModal(e){
    if(e){
      e.preventDefault();
      e.stopPropagation();
    }
    var modal=document.getElementById('modal');
    if(modal)modal.classList.remove('show');
  }
  window.__g3daiCloseModal=g3daiCloseModal;
  document.addEventListener('click',function(e){
    var modal=document.getElementById('modal');
    if(modal && modal.classList.contains('show') && e.target===modal)g3daiCloseModal(e);
  });
  function g3daiReadState(){
    var s=readState();

  $('newChatFromSettings').onclick=()=>window.__g3daiNewChat();$('theme').value=S.settings.theme||'dark';$('theme').onchange=()=>{S.settings.theme=$('theme').value;save();applyTheme()};
  $('ma').value=S.settings.material;
  $('connect').onclick=connectGrok;
  $('saveSet').onclick=()=>{S.settings.printer=$('pr').value;S.settings.nozzle=$('no').value;S.settings.material=$('ma').value;save();$('modal').classList.remove('show');render();refreshGrok()};
};
const app=document.querySelector('.app');
const sideMenu=document.querySelector('.side');
const menuBackdrop=$('menuBackdrop');

function syncMenus(){
  S.ui=S.ui||{};
  const closed=!!S.ui.leftClosed;
  const rightClosed=typeof window.__g3daiRightClosed==='boolean'?window.__g3daiRightClosed:!!S.ui.rightClosed;
  S.ui.rightClosed=rightClosed;
  app.classList.toggle('left-closed',closed);
  app.classList.toggle('left-open',!closed);
  app.classList.toggle('right-closed',rightClosed);
  $('menuToggle').setAttribute('aria-expanded',closed?'false':'true');
  $('menuToggle').title=closed?'Open left menu':'Close left menu';
  const rb=$('rightMenuToggle');
  if(rb){
    rb.setAttribute('aria-expanded',rightClosed?'false':'true');
    rb.title=rightClosed?'Open right menu':'Close right menu';
  }
}

function closeLeftMenu(){
  S.ui=S.ui||{};
  S.ui.leftClosed=true;
  save();
  syncMenus();
}

function toggleLeftMenu(){
  S.ui=S.ui||{};
  S.ui.leftClosed=!S.ui.leftClosed;
  save();
  syncMenus();
}

menuBackdrop.addEventListener('pointerdown',e=>{
  e.preventDefault();
  closeLeftMenu();
});
menuBackdrop.addEventListener('click',closeLeftMenu);

document.addEventListener('pointerdown',e=>{
  if(S.ui?.leftClosed)return;
  if(sideMenu.contains(e.target)||$('menuToggle').contains(e.target))return;
  closeLeftMenu();
},true);

function stopGeneration(){
  if(!job)return;
  job.cancel=true;
  thinking=false;
  job=null;
  updateSendButton();
  render();
};
$('prompt').addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    if(window.__g3daiSend)window.__g3daiSend();
  }
});
$('prompt').addEventListener('input',()=>{
  $('prompt').style.height='auto';
  $('prompt').style.height=Math.min($('prompt').scrollHeight,180)+'px';
});
if($('new'))$('new').onclick=()=>{closeLeftMenu();
  S.active=null;
  chat();
  save();
  render();
  $('prompt').value='';
  $('prompt').style.height='';
};
$('search').onclick=()=>{closeLeftMenu();
  let q=window.prompt('Search chats');
  if(q){
    alert(S.chats.filter(x=>x.title.toLowerCase().includes(q.toLowerCase())).map(x=>x.title).join('\n')||'No matches');
  }
};
$('attach').onclick=()=>$('files').click();
if($('new'))$('new').onclick=()=>window.__g3daiNewChat();
document.addEventListener('click',e=>{
  const b=e.target.closest('#new,#search,#projects,#settings');
  if(b)setTimeout(closeLeftMenu,0);
});
$('files').onchange=()=>{
  $('fileNames').textContent=[...$('files').files].map(x=>x.name).join(', ');
};
$('projects').onclick=()=>{closeLeftMenu();modal('<h2>Projects</h2><div class="notice">Chats and model history are saved in this browser. Grok handles your account login on grok.com.</div>');
window.__g3daiModuleReady=true;
hydrateChats();
window.__g3daiOpenChat=window.__g3daiOpenChat;
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
applyTheme();render();refreshGrok();
</script></body></html>
