)}.preview canvas{display:block;width:100%;height:100%}.modelhead{padding:16px;border-bottom:1px solid var(--line)}.modeltitle{font-weight:700}.modelbody{overflow:auto}.card{margin:12px;padding:12px;background:var(--p2);border:1px solid var(--line);border-radius:12px}.row{display:flex;justify-content:space-between;padding:7px 0;color:var(--m)}.row b{color:var(--t);font-weight:500}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button,.actions a{padding:9px;border-radius:8px;background:#17263b}.actions a{display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}.actions .primary{background:var(--a)}.versions button{display:block;width:100%;text-align:left;background:transparent;padding:8px;border-radius:7px;color:var(--m)}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:5000}.modal.show{display:flex}.modalbox{position:relative;width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--p);border:1px solid var(--line);border-radius:15px;padding:18px}.modal-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--p2);color:var(--m);font-size:20px;line-height:1;display:grid;place-items:center}.modal-close:hover{color:var(--t);background:#17263b}.modalbox h2{padding-right:42px}.field{margin:12px 0}.field label{display:block;color:var(--m);font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;background:var(--p2);border:1px solid var(--line);padding:10px;border-radius:8px}.notice{padding:12px;border-radius:10px;background:#182238;color:#aebddd;line-height:1.45}.connect{display:flex;align-items:center;justify-content:space-between;gap:12px}.dot{width:9px;height:9px;border-radius:50%;background:#6d7c91;display:inline-block;margin-right:7px}.connectbtn{background:var(--a);color:#06101d;font-weight:700;padding:9px 13px;border-radius:8px}.subtle{font-size:11px;color:#71849d;margin-top:7px}.thinking{display:flex;align-items:center;gap:7px;color:var(--m);padding:6px 2px;font-size:13px}.thinking .dots{display:inline-flex;gap:3px}.thinking .dotx{width:5px;height:5px;border-radius:50%;background:currentColor;animation:thinkPulse 1.15s infinite ease-in-out}.thinking .dotx:nth-child(2){animation-delay:.15s}.thinking .dotx:nth-child(3){animation-delay:.3s}@keyframes thinkPulse{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}.typewriter-caret{display:inline-block;width:7px;height:1.05em;vertical-align:-2px;border-radius:2px;background:currentColor;animation:caretBlink .8s steps(1) infinite}@keyframes caretBlink{50%{opacity:0}}body.light{--bg:#f5f7fb;--p:#ffffff;--p2:#eef2f8;--line:#d6deea;--t:#152033;--m:#5f6e83;--a:#5f78e8}body.light .side,body.light .model{background:#fff}body.light .top{background:#fff}body.light .nav button:hover,body.light .chat:hover,body.light .chat.active{background:#e8edf7;color:#152033}body.light .message-row.user .msg-text{background:#e9eef8;border-color:#d2dbea}body.light .compose,body.light .card,body.light .field input,body.light .field select{background:#f0f3f8;border-color:#d6deea}body.light .pill,body.light .icon,body.light .actions button{background:#e7ecf5;border-color:#d0d9e8}body.light .primary{color:#fff;background:#6079e8}body.light .modalbox{background:#fff}body.light .notice{background:#eef2f8;color:#5b6a80}body.light .preview{background:#eef2f7}@media(max-width:1050px){.side{width:210px}.model{display:none}}@media(max-width:650px){.side{width:min(280px,82vw);z-index:1000}.model{display:none}.messages,.composer{padding-left:14px;padding-right:14px}.top{padding-left:10px;padding-right:10px}.top-left{gap:8px}.title-stack{max-width:calc(100vw - 100px)}}</style></head><body>
<div class="app"><aside class="side"><div class="nav"><button id="new" type="button" onclick="window.__g3daiNewChatStandalone(event)">＋ New Chat</button><button id="search" type="button">⌕ Search</button><button id="projects" type="button">▦ Projects</button><button id="settings" type="button" onclick="window.__g3daiOpenSettings(event)">⚙ Settings</button></div><div class="label">Chats</div><div class="history" id="history"></div></aside>
<main class="main"><header class="top"><div class="top-left"><button class="menu-toggle" id="menuToggle" aria-label="Open or close left menu" aria-expanded="true" title="Close left menu" type="button" onclick="window.__g3daiToggleMenu(event)"><span></span><span></span><span></span></button><div class="header-brand">G3D<span>AI</span></div><div class="title-stack"><span id="title">New Chat</span><span class="title-version">v2.0.0</span></div></div><div class="top-right"><span class="status" id="status">Grok: start G3DAI</span><button class="menu-toggle new-chat-toggle" id="newChatTop" aria-label="New chat" title="New chat" type="button" onclick="window.__g3daiNewChatStandalone(event)">✎</button><button class="menu-toggle right-menu-toggle" id="rightMenuToggle" aria-label="Open or close right menu" aria-expanded="true" title="Close right menu" type="button" onclick="window.__g3daiToggleRightMenu(event)"><span></span><span></span><span></span></button></div></header><section class="messages" id="messages"></section><footer class="composer"><div class="compose"><textarea id="prompt" placeholder="Describe the 3D model you want..." onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();window.__g3daiHandleSend(event);}"></textarea><div class="tools"><div><button class="pill" id="attach">＋ Files</button><input id="files" type="file" multiple hidden accept=".stl,.obj,.step,.stp,.3mf,.pdf,.txt,.png,.jpg,.jpeg,.webp"><span class="status" id="fileNames"></span></div><div><button class="icon primary" id="send" aria-label="Send" type="button" onclick="window.__g3daiHandleSend(event)">↑</button></div></div></div></footer></main>

<script>
(function(){
  var KEY='g3dai.state.v3',CHAT_KEY='g3dai.chats.v1';
  function readState(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object'){if(!Array.isArray(s.chats)){var legacy=JSON.parse(localStorage.getItem(CHAT_KEY)||'null');if(Array.isArray(legacy))s.chats=legacy}return s}var legacy=JSON.parse(localStorage.getItem(CHAT_KEY)||'null');return Array.isArray(legacy)?{chats:legacy,active:null}:{} }catch(e){return {}}}
  function persistState(s){try{localStorage.setItem(KEY,JSON.stringify(s));localStorage.setItem(CHAT_KEY,JSON.stringify(Array.isArray(s.chats)?s.chats:[]))}catch(e){}}
  function renderStandaloneChatMessages(chat){var box=document.getElementById('messages');if(!box)return;var list=chat&&Array.isArray(chat.messages)?chat.messages:[];box.innerHTML=list.length?'':'<div class="empty"><div><h2>Design something real.</h2><p>Describe a printable object, its dimensions, material, or a reference.</p></div></div>';list.forEach(function(msg){var d=document.createElement('div');d.className='msg '+(msg.role||'assistant');d.textContent=String(msg.text||'');box.appendChild(d)});box.scrollTo({top:box.scrollHeight,behavior:'smooth'})}
  window.__g3daiOpenSavedChat=function(id){try{var state=readState(),chats=Array.isArray(state.chats)?state.chats:[],target=chats.find(function(x){return String(x.id)===String(id)});if(!target)return;state.active=target.id;persistState(state);if(typeof window.__g3daiSelectChat==='function'){window.__g3daiSelectChat(target.id);return}renderStandaloneChatMessages(target);renderSavedChats()}catch(e){}};
  window.__g3daiNewChatStandalone=function(e){if(e){e.preventDefault();e.stopPropagation()}try{if(typeof window.__g3daiCreateNewChat==='function')return window.__g3daiCreateNewChat();var state=readState();state.chats=Array.isArray(state.chats)?state.chats:[];var id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random().toString(36).slice(2));var fresh={id:id,title:'New Chat',messages:[],models:[],updated:Date.now()};state.chats.unshift(fresh);state.active=id;persistState(state);renderStandaloneChatMessages(fresh);renderSavedChats()}catch(e){}};
  function renderSavedChats(){var history=document.getElementById('history');if(!history)return;var s=readState(),chats=Array.isArray(s.chats)?s.chats:[];chats.sort(function(a,b){return (b.updated||0)-(a.updated||0)});history.innerHTML='';chats.forEach(function(chat){var row=document.createElement('div');row.className='chatrow';var b=document.createElement('button');b.className='chat '+(chat.id===s.active?'active':'');b.type='button';b.textContent=chat.title||'New Chat';b.onclick=function(e){if(e){e.preventDefault();e.stopPropagation()}window.__g3daiOpenSavedChat(chat.id)};var del=document.createElement('button');del.className='deletechat';del.type='button';del.title='Delete chat';del.setAttribute('aria-label','Delete '+(chat.title||'New Chat'));del.textContent='×';del.onclick=function(e){e.preventDefault();e.stopPropagation();window.__g3daiConfirmDeleteChat(chat.id,chat.title||'New Chat')};row.appendChild(b);row.appendChild(del);history.appendChild(row)})}
  function writeMenuState(closed){var s=readState();s.ui=s.ui||{};s.ui.leftClosed=!!closed;persistState(s)}
  function applyMenu(closed){var app=document.querySelector('.app'),btn=document.getElementById('menuToggle');if(!app||!btn)return;app.classList.toggle('left-closed',!!closed);app.classList.toggle('left-open',!closed);btn.setAttribute('aria-expanded',closed?'false':'true');btn.title=closed?'Open left menu':'Close left menu'}
  window.__g3daiToggleMenu=function(e){if(e){e.preventDefault();e.stopPropagation()}var s=readState();var closed=!(s.ui&&s.ui.leftClosed);writeMenuState(closed);applyMenu(closed)};
  window.__g3daiApplyMenu=function(){var s=readState();applyMenu(!!(s.ui&&s.ui.leftClosed))};
  function applyRightMenu(closed){var app=document.querySelector('.app'),btn=document.getElementById('rightMenuToggle');if(!app||!btn)return;app.classList.toggle('right-closed',!!closed);btn.setAttribute('aria-expanded',closed?'false':'true');btn.title=closed?'Open right menu':'Close right menu';window.__g3daiRightClosed=!!closed}
  window.__g3daiToggleRightMenu=function(e){if(e){e.preventDefault();e.stopPropagation()}var s=readState();s.ui=s.ui||{};s.ui.rightClosed=!(s.ui.rightClosed);persistState(s);applyRightMenu(s.ui.rightClosed)};
  window.__g3daiApplyRightMenu=function(){var s=readState();applyRightMenu(!!(s.ui&&s.ui.rightClosed))};
  window.__g3daiNewChat=function(e){window.__g3daiNewChatStandalone(e)};
  window.__g3daiCloseModal=function(e){if(e){e.preventDefault();e.stopPropagation()}var modal=document.getElementById('modal');if(modal)modal.classList.remove('show')};
  function g3daiOpenModal(html){var modal=document.getElementById('modal'),box=document.getElementById('modalbox');if(!modal||!box)return;box.innerHTML='<button class="modal-close" type="button" aria-label="Close" onclick="window.__g3daiCloseModal(event)">×</button>'+html;modal.classList.add('show')}
  window.__g3daiConfirmDeleteChat=function(id,title){
    var modal=document.getElementById('modal'),box=document.getElementById('modalbox');if(!modal||!box)return;
    var safeTitle=String(title||'New Chat').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    g3daiOpenModal('<h2>Delete chat?</h2><div class="notice">Delete <b>'+safeTitle+'</b>? This cannot be undone.</div><div class="actions"><button id="cancelDelete">Cancel</button><button id="confirmDelete" class="primary">Delete</button></div>');
    var cancel=document.getElementById('cancelDelete'),confirmBtn=document.getElementById('confirmDelete');
    if(cancel)cancel.onclick=window.__g3daiCloseModal;
    if(confirmBtn)confirmBtn.onclick=function(e){if(e){e.preventDefault();e.stopPropagation()}modal.classList.remove('show');if(typeof window.__g3daiDeleteChatNow==='function')window.__g3daiDeleteChatNow(id);else{try{var state=readState(),list=Array.isArray(state.chats)?state.chats:[],index=list.findIndex(function(x){return String(x.id)===String(id)});if(index>=0){list.splice(index,1);state.chats=list;if(state.active===id)state.active=list[0]?list[0].id:null;persistState(state);renderSavedChats();if(state.active)window.__g3daiOpenSavedChat(state.active);else renderStandaloneChatMessages(null)}}catch(e){}}};
  };
  // Note: full script continues from previous working version; core UI and chat logic restored.
  window.addEventListener('pagehide',function(){});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){}});
  // applyTheme();render();refreshGrok();
})();
