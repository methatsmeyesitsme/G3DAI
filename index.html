px solid var(--line);border-radius:12px}.row{display:flex;justify-content:space-between;padding:7px 0;color:var(--m)}.row b{color:var(--t);font-weight:500}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{padding:9px;border-radius:8px;background:#17263b}.actions .primary{background:var(--a)}.versions button{display:block;width:100%;text-align:left;background:transparent;padding:8px;border-radius:7px;color:var(--m)}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{width:min(620px,100%);background:var(--p);border:1px solid var(--line);border-radius:15px;padding:18px}.field{margin:12px 0}.field label{display:block;color:var(--m);font-size:12px;margin-bottom:6px}.field input,.field select{width:100%;background:var(--p2);border:1px solid var(--line);padding:10px;border-radius:8px}.notice{padding:12px;border-radius:10px;background:#182238;color:#aebddd;line-height:1.45}.connect{display:flex;align-items:center;justify-content:space-between;gap:12px}.dot{width:9px;height:9px;border-radius:50%;background:#6d7c91;display:inline-block;margin-right:7px}.connectbtn{background:var(--a);color:#06101d;font-weight:700;padding:9px 13px;border-radius:8px}.subtle{font-size:11px;color:#71849d;margin-top:7px}.thinking{display:flex;align-items:center;gap:7px;color:var(--m);padding:6px 2px;font-size:13px}.thinking .dots{display:inline-flex;gap:3px}.thinking .dotx{width:5px;height:5px;border-radius:50%;background:currentColor;animation:thinkPulse 1.15s infinite ease-in-out}.thinking .dotx:nth-child(2){animation-delay:.15s}.thinking .dotx:nth-child(3){animation-delay:.3s}@keyframes thinkPulse{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}.typewriter-caret{display:inline-block;width:7px;height:1.05em;vertical-align:-2px;border-radius:2px;background:currentColor;animation:caretBlink .8s steps(1) infinite}@keyframes caretBlink{50%{opacity:0}}body.light{--bg:#f5f7fb;--p:#ffffff;--p2:#eef2f8;--line:#d6deea;--t:#152033;--m:#5f6e83;--a:#5f78e8}body.light .side,body.light .model{background:#fff}body.light .top{background:#fff}body.light .nav button:hover,body.light .chat:hover,body.light .chat.active{background:#e8edf7;color:#152033}body.light .user{background:#e9eef8;border-color:#d2dbea}body.light .compose,body.light .card,body.light .field input,body.light .field select{background:#f0f3f8;border-color:#d6deea}body.light .pill,body.light .icon,body.light .actions button{background:#e7ecf5;border-color:#d0d9e8}body.light .primary{color:#fff;background:#6079e8}body.light .modalbox{background:#fff}body.light .notice{background:#eef2f8;color:#5b6a80}body.light .preview{background:#eef2f7}@media(max-width:1050px){.side{width:210px}.model{display:none}}@media(max-width:650px){.app{width:100%;height:100vh}.side{display:flex;width:min(280px,82vw);z-index:200}.model{display:none}.app.left-closed .side{display:flex;transform:translateX(-100%)}.messages,.composer{padding-left:14px;padding-right:14px}.top{padding-left:10px;padding-right:10px}.top-left{gap:8px}.title-stack{max-width:calc(100vw - 100px)}}

<div class="app"><aside class="side"><div class="brand">G3D<span>AI</span><div class="version">v1.0.38</div></div><div class="nav"><button id="new">＋ New Chat</button><button id="search">⌕ Search</button><button id="projects">▦ Projects</button><button id="settings">⚙ Settings</button></div><div class="label">Chats</div><div class="history" id="history"></div></aside>
<main class="main"><header class="top"><div class="top-left"><button class="menu-toggle" id="menuToggle" onclick="window.g3dToggleMenus()" aria-label="Open or close side menus" title="Open/close menus"><span></span><span></span><span></span></button><div class="title-stack"><span id="title">New Chat</span><span class="title-version">v1.0.38</span></div></div><span class="status" id="status">Grok: start G3DAI</span></header><section class="messages" id="messages"></section><footer class="composer"><div class="compose"><textarea id="prompt" placeholder="Describe the 3D model you want..."></textarea><div class="tools"><div><button class="pill" id="attach">＋ Files</button><input id="files" type="file" multiple hidden accept=".stl,.obj,.step,.stp,.3mf,.pdf,.txt,.png,.jpg,.jpeg,.webp"><span class="status" id="fileNames"></span></div><div><button class="icon primary" id="send" aria-label="Send">↑</button></div></div></div></footer></main>

<script>
window.g3dToggleMenus=function(){
  const app=document.querySelector('.app');
  if(!app)return;
  const closing=!(app.classList.contains('left-closed')&&app.classList.contains('right-closed'));
  app.classList.toggle('left-closed',closing);
  app.classList.toggle('right-closed',closing);
  try{
    const key='g3dai.state.v3';
    const state=JSON.parse(localStorage.getItem(key)||'{}');
    state.ui=state.ui||{};
    state.ui.leftClosed=closing;
    state.ui.rightClosed=closing;
    localStorage.setItem(key,JSON.stringify(state));
  }catch{}
};
</script>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{STLExporter}from'three/addons/exporters/STLExporter.js';
const $=x=>document.getElementById(x),KEY='g3dai.state.v3';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{chats:[],active:null,settings:{printer:'Bambu Lab P2S',nozzle:'0.4',material:'PLA',theme:'dark'},grok:{connected:false,backendUrl:''}},scene,camera,renderer,controls,mesh,job=null,thinking=false;
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const uid=()=>crypto.randomUUID();S.settings=Object.assign({printer:'Bambu Lab P2S',nozzle:'0.4',material:'PLA',theme:'dark'},S.settings||{});S.grok=Object.assign({connected:false,backendUrl:''},S.grok||{});function applyTheme(){document.body.classList.toggle('light',S.settings.theme==='light')}function chat(){if(!S.active){let c={id:uid(),title:'New Chat',messages:[],models:[],updated:Date.now()};S.chats.unshift(c);S.active=c.id;save()}return S.chats.find(x=>x.id===S.active)}
function add(role,text){let c=chat();c.messages.push({role,text,at:Date.now()});c.updated=Date.now();if(role==='user'&&c.title==='New Chat')c.title=text.slice(0,40);save();render()}
function deleteChat(id){let index=S.chats.findIndex(x=>x.id===id);if(index<0)return;let title=S.chats[index].title;if(!confirm('Delete "'+title+'"?'))return;S.chats.splice(index,1);if(S.active===id)S.active=S.chats[0]?.id||null;save();render()}
async function typeAssistant(text,jobRef){let c=chat();let msg={role:'assistant',text:'',at:Date.now()};c.messages.push(msg);c.updated=Date.now();save();thinking=false;render();let el=[...document.querySelectorAll('#messages .assistant')].at(-1);if(!el)return;const total=text.length;const chunk=Math.max(2,Math.min(7,Math.ceil(total/450)));const delay=10;for(let i=0;i<total;i+=chunk){if(jobRef.cancel)return;msg.text=text.slice(0,Math.min(total,i+chunk));el.textContent=msg.text;let caret=document.createElement('span');caret.className='typewriter-caret';el.appendChild(caret);await new Promise(r=>setTimeout(r,delay));}el.textContent=text;save();render()}
function render(){applyTheme();syncMenus();let c=chat();$('title').textContent=c.title;let m=$('messages');m.innerHTML=c.messages.length?'':'<div class="empty"><div><h2>Design something real.</h2><p>Describe a printable object, its dimensions, material, or a reference.</p></div></div>';c.messages.forEach(x=>{let d=document.createElement('div');d.className='msg '+x.role;d.textContent=x.text;m.appendChild(d)});if(thinking){let t=document.createElement('div');t.className='thinking';t.innerHTML='<span>Thinking</span><span class="dots"><span class="dotx"></span><span class="dotx"></span><span class="dotx"></span></span>';m.appendChild(t)}let h=$('history');h.innerHTML='';S.chats.sort((a,b)=>b.updated-a.updated).forEach(x=>{let row=document.createElement('div');row.className='chatrow';let b=document.createElement('button');b.className='chat '+(x.id===S.active?'active':'');b.textContent=x.title;b.onclick=()=>{S.active=x.id;save();render();showLast();updateSendButton()};let del=document.createElement('button');del.className='deletechat';del.title='Delete chat';del.setAttribute('aria-label','Delete '+x.title);del.textContent='×';del.onclick=e=>{e.stopPropagation();deleteChat(x.id)};row.append(b,del);h.appendChild(row)});$('status').textContent='Grok: '+(thinking?'Thinking…':(S.grok.connected?'connected':'not connected'));showLast();if(thinking||c.messages.length)m.scrollTo({top:m.scrollHeight,behavior:'smooth'})}
function phoneStand(){let g=new THREE.Group(),base=new THREE.Mesh(new THREE.BoxGeometry(90,75,8)),back=new THREE.Mesh(new THREE.BoxGeometry(90,8,65)),lip=new THREE.Mesh(new THREE.BoxGeometry(80,4,7));base.position.z=4;back.rotation.x=THREE.MathUtils.degToRad(25);back.position.set(0,10,36);lip.position.set(0,-25,12);g.add(base,back,lip);return g}
function squish(){let g=new THREE.Group(),a=new THREE.BoxGeometry(45,45,45),e=new THREE.EdgesGeometry(a),o=new THREE.LineSegments(e,new THREE.LineBasicMaterial()),i=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(39,39,39)),new THREE.LineBasicMaterial());g.add(o,i);return g}
function make(p){let q=p.toLowerCase(),type=q.includes('phone')&&q.includes('stand')?'phone-stand':(q.includes('squish')||q.includes('gyroid')?'squish-cube':'box'),g=type==='phone-stand'?phoneStand():type==='squish-cube'?squish():new THREE.Mesh(new THREE.BoxGeometry(40,40,40));g.traverse(o=>{if(o.isMesh)o.material=new THREE.MeshStandardMaterial({roughness:.7,metalness:.05})});return{name:type==='phone-stand'?'Adjustable Phone Stand':type==='squish-cube'?'GH3D Squish Cube':'Parametric Printable Part',type,g}}
function init(){let e=$('preview');scene=new THREE.Scene();scene.background=new THREE.Color(0x07101a);camera=new THREE.PerspectiveCamera(45,e.clientWidth/e.clientHeight,.1,2000);camera.position.set(120,100,150);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(e.clientWidth,e.clientHeight);e.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x304060,2));let l=new THREE.DirectionalLight(0xffffff,2);l.position.set(100,150,100);scene.add(l);addEventListener('resize',()=>{camera.aspect=e.clientWidth/e.clientHeight;camera.updateProjectionMatrix();renderer.setSize(e.clientWidth,e.clientHeight)});(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})()}
function show(g){if(!renderer)init();if(mesh)scene.remove(mesh);mesh=g;scene.add(g);let b=new THREE.Box3().setFromObject(g),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),mx=Math.max(s.x,s.y,s.z);g.position.sub(c);camera.position.set(mx*1.8,mx*1.5,mx*1.8);controls.target.set(0,0,0);controls.update()}
function stl(g){return new STLExporter().parse(g,{binary:true})}function dl(data,name){let u=URL.createObjectURL(new Blob([data],{type:'model/stl'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function showModel(v){$('modelTitle').textContent=v.name+' · v'+v.version;$('modelMeta').textContent=v.type+' · '+S.settings.material;let b=$('modelBody');b.innerHTML='<div class="card"><div class="row"><span>Version</span><b>v'+v.version+'</b></div><div class="row"><span>Printer</span><b>'+S.settings.printer+'</b></div><div class="row"><span>Nozzle</span><b>'+S.settings.nozzle+' mm</b></div><div class="row"><span>Material</span><b>'+S.settings.material+'</b></div><div class="actions"><button id="dl">Download STL</button><button id="var" class="primary">Create variation</button></div><div class="label" style="padding-left:0">Versions</div><div id="vers" class="versions"></div></div>';show(make(v.prompt).g);$('dl').onclick=()=>{let x=make(v.prompt);show(x.g);dl(stl(x.g),v.name.replace(/\s+/g,'-').toLowerCase()+'-v'+v.version+'.stl')};$('var').onclick=()=>{$('prompt').value='Modify '+v.name+': ';$('prompt').focus()};chat().models.forEach(x=>{let z=document.createElement('button');z.textContent='v'+x.version+' · '+x.name;z.onclick=()=>showModel(x);$('vers').appendChild(z)})}
function showLast(){let c=chat();if(c.models.length)showModel(c.models[c.models.length-1])}
const LOCAL_BACKEND='http://127.0.0.1:8787';
function backendUrl(){let u=(S.grok&&S.grok.backendUrl||'').trim().replace(/\/+$/,'');return u||LOCAL_BACKEND}
async function api(path,options={}){let r=await fetch(backendUrl()+path,options);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'G3DAI Grok bridge request failed');return d}
async function refreshGrok(){try{let d=await api('/api/grok/status');S.grok.connected=!!d.authenticated;save();$('status').textContent='Grok: '+(S.grok.connected?'connected':'not signed in')}catch{S.grok.connected=false;$('status').textContent='Grok: start G3DAI'}}
function updateSendButton(){
  const b=$('send');
  const active=!!job;
  b.textContent=active?'■':'↑';
  b.classList.toggle('primary',!active);
  b.setAttribute('aria-label',active?'Stop generation':'Send');
  b.title=active?'Stop generation':'Send message';
}
async function send(){
  let p=$('prompt').value.trim();
  if(!p||job)return;
  let c=chat();
  add('user',p);
  $('prompt').value='';
  job={cancel:false};
  let jobRef=job;
  updateSendButton();
  thinking=true;
  render();
  try{
    let history=c.messages.map(x=>({role:x.role,text:x.text}));
    let d=await api('/api/grok/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chatId:c.id,prompt:p,history,printer:S.settings.printer,nozzle:S.settings.nozzle,material:S.settings.material})});
    if(jobRef.cancel)return;
    thinking=false;
    await typeAssistant(d.output||'Grok returned an empty response.',jobRef);
  }catch(e){
    thinking=false;
    if(!jobRef.cancel)add('assistant','Grok error: '+e.message);
  }finally{
    if(job===jobRef)job=null;
    updateSendButton();
    refreshGrok();
  }
}
function modal(s){$('modalbox').innerHTML=s;$('modal').classList.add('show')};$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
function connectGrok(){
  let poll=null;
  modal('<h2>Connect Grok</h2><div class="notice"><b>Easy setup — no API key and no Node.js.</b><br><br>G3DAI runs a tiny helper on your Windows computer and uses the official Grok browser login.</div><div class="field"><label>1. Start it</label><div class="notice">From the downloaded G3DAI folder, double-click <b>Start-G3DAI.bat</b>. Do not install Node.js.</div></div><div class="field"><label>2. Automatic setup</label><div class="notice">The launcher installs the official Grok CLI automatically if it is missing.</div></div><div class="field"><label>3. Sign in</label><div class="notice">Click <b>Sign in with Grok</b>. A normal Grok login opens in your browser. Sign in there.</div></div><div class="field"><label>4. Finish</label><div class="notice">Return here and click <b>Check connection</b>. When it says <b>Connected</b>, close this window and chat normally.</div></div><div class="field"><label>Nothing to enter</label><div class="notice">Never enter your Grok email, Grok password, xAI API key, token, or secret into G3DAI.</div></div><div class="actions"><button id="login" class="primary">Sign in with Grok</button><button id="check">Check connection</button><button id="close">Close</button></div><div id="loginInfo" class="subtle">Start-G3DAI.bat must be running.</div>');
  $('login').onclick=async()=>{
    try{
      await api('/api/grok/login',{method:'POST'});
      $('loginInfo').textContent='The official Grok sign-in opened. Finish signing in, then click Check connection.';
      if(poll)clearInterval(poll);
      poll=setInterval(async()=>{try{let d=await api('/api/grok/status');if(d.authenticated){clearInterval(poll);S.grok.connected=true;save();$('loginInfo').textContent='Connected!';$('status').textContent='Grok: connected'}}catch{}},2000);
    }catch{$('loginInfo').textContent='Start-G3DAI.bat is not running. Close G3DAI and double-click it from the downloaded folder.'}
  };
  $('check').onclick=()=>refreshGrok();
  $('close').onclick=()=>{if(poll)clearInterval(poll);$('modal').classList.remove('show')};
}
$('settings').onclick=()=>{closeLeftMenuImmediate();modal('<h2>Settings</h2><div class="field"><label>Appearance</label><select id="theme"><option value="dark">Dark mode</option><option value="light">Light mode</option></select></div><div class="field"><label>Grok connection</label><div class="card" style="margin:0"><div class="connect"><span><span class="dot" style="background:'+(S.grok.connected?'#62d18a':'#6d7c91')+'"></span><b>'+(S.grok.connected?'Connected':'Not connected')+'</b></span><button class="connectbtn" id="connect">Connect</button></div><div class="subtle">Uses official Grok browser sign-in. No API key is used or stored by G3DAI.</div></div></div><div class="field"><label>Printer</label><input id="pr" value="'+S.settings.printer+'"></div><div class="field"><label>Nozzle</label><input id="no" value="'+S.settings.nozzle+'"></div><div class="field"><label>Material</label><select id="ma"><option>PLA</option><option>TPU</option><option>PETG</option><option>ABS</option></select></div><button class="pill primary" id="saveSet">Save</button>');
  $('theme').value=S.settings.theme||'dark';$('theme').onchange=()=>{S.settings.theme=$('theme').value;save();applyTheme()};
  $('ma').value=S.settings.material;
  $('connect').onclick=connectGrok;
  $('saveSet').onclick=()=>{S.settings.printer=$('pr').value;S.settings.nozzle=$('no').value;S.settings.material=$('ma').value;save();$('modal').classList.remove('show');render();refreshGrok()};
};
$('send').onclick=()=>{if(job)stopGeneration();else send()};
const app=document.querySelector('.app');
function syncMenus(){
  const left=!!S.ui?.leftClosed,right=!!S.ui?.rightClosed;
  app.classList.toggle('left-closed',left);
  app.classList.toggle('right-closed',right);
  $('menuToggle').title=(left?'Open left menu':'Close left menu')+' / '+(right?'open right menu':'close right menu');
}
function toggleMenus(){
  S.ui=S.ui||{};
  const shouldClose=!(S.ui.leftClosed&&S.ui.rightClosed);
  S.ui.leftClosed=shouldClose;
  S.ui.rightClosed=shouldClose;
  save();
  syncMenus();
}
$('menuToggle').addEventListener('click',toggleMenus);
function closeLeftMenu(){
  S.ui=S.ui||{};
  S.ui.leftClosed=true;
  S.ui.rightClosed=true;
  save();
  syncMenus();
}
function closeLeftMenuImmediate(){
  const side=document.querySelector('.side');
  if(side){
    side.style.transform='translateX(-100%)';
    side.style.opacity='0';
    side.style.pointerEvents='none';
  }
  S.ui=S.ui||{};
  S.ui.leftClosed=true;
  S.ui.rightClosed=true;
  save();
  syncMenus();
}
function closeLeftFromOutside(e){
  if(S.ui?.leftClosed)return;
  const side=document.querySelector('.side');
  const menu=$('menuToggle');
  if(side&&!side.contains(e.target)&&menu&&!menu.contains(e.target)){
    S.ui=S.ui||{};
    S.ui.leftClosed=true;
    S.ui.rightClosed=true;
    save();
    syncMenus();
  }
}
document.addEventListener('pointerdown',closeLeftFromOutside,true);
document.addEventListener('touchstart',closeLeftFromOutside,{capture:true,passive:true});

function stopGeneration(){
  if(!job)return;
  job.cancel=true;
  thinking=false;
  job=null;
  updateSendButton();
  render();
};
$('prompt').addEventListener('keydown',e=>{
  if(e.key==='Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    send();
  }
});
$('prompt').addEventListener('input',()=>{
  $('prompt').style.height='auto';
  $('prompt').style.height=Math.min($('prompt').scrollHeight,180)+'px';
});
$('new').onclick=()=>{closeLeftMenuImmediate();
  S.active=null;
  chat();
  save();
  render();
  $('prompt').value='';
  $('prompt').style.height='';
};
$('search').onclick=()=>{closeLeftMenuImmediate();
  let q=window.prompt('Search chats');
  if(q){
    alert(S.chats.filter(x=>x.title.toLowerCase().includes(q.toLowerCase())).map(x=>x.title).join('\n')||'No matches');
  }
};
$('attach').onclick=()=>$('files').click();
document.addEventListener('click',e=>{
  const b=e.target.closest('#new,#search,#projects,#settings');
  if(b)setTimeout(closeLeftMenuImmediate,0);
});
$('files').onchange=()=>{
  $('fileNames').textContent=[...$('files').files].map(x=>x.name).join(', ');
};
$('projects').onclick=()=>{closeLeftMenuImmediate();modal('<h2>Projects</h2><div class="notice">Chats and model history are saved in this browser. Grok handles your account login on grok.com.</div>');
applyTheme();render();refreshGrok();
</script></body></html>
